# CryptoAnalyze : tests + construction + cours (robot) + publication sur GitHub Pages. Gratuit sur un dépôt public.
#  - à chaque envoi sur main
#  - toutes les 2 heures : cours du top 250 CoinGecko rafraîchis (le site est republié, rien n'est commité)
#  - le 1er du mois : petit commit « keepalive » (GitHub désactive les tâches planifiées après 60 jours sans activité)
name: Publier CryptoAnalyze
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */2 * * *'
    - cron: '41 6 1 * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Cours du top 250 (CoinGecko)
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          if ! node scripts/update-prices.mjs dist/prices.json; then
            echo "Robot en échec : on republie les derniers cours en ligne"
            curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/prices.json" -o dist/prices.json || echo "Aucun cours précédent : l'app interrogera CoinGecko directement"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Keepalive mensuel
        if: github.event.schedule == '41 6 1 * *'
        run: |
          git config user.name "cryptoanalyze-bot"
          git config user.email "cryptoanalyze-bot@users.noreply.github.com"
          date -u +%FT%TZ > .github/keepalive
          git add .github/keepalive
          git commit -m "chore: keepalive" && git push || true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
